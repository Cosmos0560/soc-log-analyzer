[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-log-analyzer"
dynamic = ["version"]
description = "A lightweight Python log parser and rule-based threat detection engine for SOC analyst training."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Otabek Yakubov" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "tzdata",
]

[project.scripts]
soc-log-analyzer = "soc_analyzer.cli:main"

[tool.hatch.version]
path = "src/soc_analyzer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff only excludes .venv by default; the two check venvs live in the project folder too.
extend-exclude = [".venv-wsl", ".venv-release"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["soc_analyzer"]
branch = true

[tool.coverage.report]
show_missing = true
