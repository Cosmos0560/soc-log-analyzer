[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-log-analyzer"
dynamic = ["version"]
description = "A lightweight Python log parser and rule-based threat detection engine for SOC analyst training."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Otabek Yakubov" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "tzdata",
]

[project.scripts]
soc-log-analyzer = "soc_analyzer.cli:main"

[tool.hatch.version]
path = "src/soc_analyzer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["soc_analyzer"]
branch = true

[tool.coverage.report]
show_missing = true
